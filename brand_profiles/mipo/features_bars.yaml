# ⚠️ VLM 纯视觉锚定量表 —— 不含任何销量预判语义
# 所有 anchor 的 description 只描述「眼睛能看到的事实」，
# 不包含「好卖/不好卖/退货率/受众/销冠」等任何价值判断。
# 销量判断由人设 LLM 基于视觉事实独立做出。
features:
  F01_silhouette:
    name: 廓形度
    category: physical
    description: 宽松/修身/廓形的程度
    anchors:
      1:
        range: [1, 2]
        label: 超紧贴身
        description: 运动压缩衣感，完全贴合身体轮廓，无宽松余量
      2:
        range: [3, 4]
        label: 修身
        description: 修身版型，略有余量但整体贴合，无明显宽松
      3:
        range: [5, 6]
        label: 常规
        description: 标准直筒H型版型，无明显宽松或紧身特征
      4:
        range: [7, 8]
        label: 宽松oversize
        description: 明显宽松廓形，衣服比身体宽出一截，有垂坠感但轮廓清晰
      5:
        range: [9, 10]
        label: 超宽廓形
        description: 灯笼感/斗篷感/极度oversize，完全脱离身体轮廓，衣袖和衣身有大量余量

  F02_clean_look:
    name: 利落感
    category: physical
    description: 视觉整洁度。短裤看腰头/松紧/裤脚剪裁（不看裤腿堆积！那是长裤的）；外套看领口/袖口/拉链；连衣裙看裙边/接缝/侧开叉
    anchors:
      1:
        range: [1, 2]
        label: 视觉混乱
        description: 腰头松紧歪斜/裤脚剪裁毛边/领口变形/零碎装饰过多，整体拥挤无序
      2:
        range: [3, 4]
        label: 不够利落
        description: 明显不规整（腰头歪/拉链不顺/接缝不齐）/过多功能细节显杂乱
      3:
        range: [5, 6]
        label: 常规
        description: 普通版型，无明显利落或不利落特征
      4:
        range: [7, 8]
        label: 比较利落
        description: 腰头/领口/袖口规整，拉链/剪裁平顺，少量装饰不拥挤
      5:
        range: [9, 10]
        label: 极利落
        description: 极简结构，腰头/领口/袖口/裤脚全部工整，专业剪裁感，无线头或毛边

  F03_color_safety:
    name: 色彩安全度
    category: physical
    description: 颜色组合的视觉属性。⚠️ 颜色混淆澄清（关键！）：①「同一件衣服上的撞色/拼接」= F03 要评估的对象；②「同款不同 SKU 的多个颜色」= 不是撞色！F03 只评主推色/主图色。
    anchors:
      1:
        range: [1, 2]
        label: 极高饱和撞色
        description: 荧光色/大面积撞色/渐变炫彩，色相差大（>120°），视觉极度吸引眼球
      2:
        range: [3, 4]
        label: 偏高饱和彩色
        description: 高饱和明亮单色或多色拼接，色相差较大（90-120°）
      3:
        range: [5, 6]
        label: 中性色彩
        description: 中等饱和度单色或简单双色拼接，色相差较小（<60°）
      4:
        range: [7, 8]
        label: 柔和低饱和彩色
        description: 莫兰迪色/大地色/低饱和粉蓝等柔和彩色系
      5:
        range: [9, 10]
        label: 安全基础中性色
        description: 黑/灰/藏青/卡其/军绿/米白等低饱和基础中性色

  F04_function_visibility:
    name: 功能可见性
    category: physical
    description: 户外功能（防水/防风/防晒/反光/口袋）的视觉显性程度
    anchors:
      1:
        range: [1, 2]
        label: 无功能元素
        description: 完全无任何户外功能视觉元素，与普通休闲装无异
      2:
        range: [3, 4]
        label: 隐约功能感
        description: 只有少量细节暗示功能（如接缝压胶/暗门襟等，不仔细看不易发现）
      3:
        range: [5, 6]
        label: 常规功能可见
        description: 常规户外功能元素清晰可见（口袋/帽檐调节/松紧收边等）
      4:
        range: [7, 8]
        label: 明显功能设计
        description: 功能设计突出（防水压胶条/反光条/多口袋系统/魔术贴调节等多处可见）
      5:
        range: [9, 10]
        label: 硬核功能外显
        description: 全身功能细节外显（全身防水条/大量功能附件/战术扣件/硬核装备感）

  F05_photogenic:
    name: 上镜感
    category: perceptual
    description: 镜头表现力，画面里是否有清晰视觉记忆点。⚠️ 如果多张图是同款不同 SKU 颜色，F05 只评估主推色的上镜感。
    anchors:
      1:
        range: [1, 2]
        label: 画面平淡
        description: 无视觉记忆点，画面中非常普通，和背景或周围物体对比度低
      2:
        range: [3, 4]
        label: 略有特色
        description: 有一定设计但记忆点弱，展示几秒后容易被遗忘
      3:
        range: [5, 6]
        label: 常规表现
        description: 中规中矩，没有特别吸睛也不丑
      4:
        range: [7, 8]
        label: 有视觉记忆点
        description: 有明显视觉标识（亮眼配色/独特廓形/吸睛细节），画面中能快速捕捉视线
      5:
        range: [9, 10]
        label: 极强镜头冲击
        description: 画面视觉冲击力极强，一眼记住，适合做封面，画面中非常突出

  F06_wearability:
    name: 实穿度
    category: perceptual
    description: 从视觉推断的日常穿着场景覆盖度（版型/廓形/设计元素是否看起来适合多场景）
    anchors:
      1:
        range: [1, 2]
        label: 视觉场景极窄
        description: 视觉上极硬核专业（如厚重登山服/极端战术装），廓形夸张或功能覆盖全身，日常穿着视觉违和
      2:
        range: [3, 4]
        label: 视觉场景受限
        description: 视觉上有夸张廓形/过多硬核功能元素/极亮色彩，日常穿着视觉略显突兀
      3:
        range: [5, 6]
        label: 视觉常规覆盖
        description: 视觉上是常规版型，廓形和功能元素适中，没有特别适合或不适合的场景
      4:
        range: [7, 8]
        label: 视觉多场景适配
        description: 款式简约，剪裁利落，功能元素适度，色彩中性，视觉上给人"哪里都能穿"的感觉
      5:
        range: [9, 10]
        label: 视觉全场景百搭
        description: 极简基础版型，中性色彩，无极端设计特征，视觉上几乎任何穿搭场景都不违和

  F07_pairing:
    name: 搭配度
    category: perceptual
    description: 从视觉推断的搭配独立性（是否看起来容易和其他单品搭配）
    anchors:
      1:
        range: [1, 2]
        label: 视觉极挑搭配
        description: 颜色极为特殊（如极亮荧光/罕见撞色），或设计极为独特夸张，视觉上很难和常规单品搭在一起
      2:
        range: [3, 4]
        label: 视觉搭配受限
        description: 有明显的风格或色彩偏向，需要特定风格下装/内搭才协调
      3:
        range: [5, 6]
        label: 视觉常规搭配度
        description: 常规版型和配色，能与多数常见单品搭配但需要稍费心思
      4:
        range: [7, 8]
        label: 视觉易搭配
        description: 版型简洁，色彩为中性或低饱和彩色，视觉上和大部分风格的下装/内搭都能自然搭配
      5:
        range: [9, 10]
        label: 视觉百搭
        description: 基础极简版型+完全中性色彩，视觉上几乎不挑搭配，任何颜色/风格的单品都能和谐共处

  F08_fabric_perception:
    name: 面料感知
    category: perceptual
    description: 从图片感知的面料视觉质感（功能感/厚度/反光/肌理）
    anchors:
      1:
        range: [1, 2]
        label: 廉价无质感
        description: 视觉无功能质感，显普通廉价，看起来像普通棉T或廉价化纤
      2:
        range: [3, 4]
        label: 普通面料感
        description: 常规棉涤/化纤视觉感，无明显功能或高级质感特征
      3:
        range: [5, 6]
        label: 常规质感适中
        description: 标准面料视觉质感，能看出基础做工但功能感不突出
      4:
        range: [7, 8]
        label: 明显功能质感
        description: 能看出科技面料视觉特征（防晒涂层光泽/防水面料微亮/速干织纹等）
      5:
        range: [9, 10]
        label: 高级功能质感
        description: 视觉传递出高级面料/高端工艺（天鹅绒/顶级防水布/精织肌理），质感看起来出众

  F09_brand_tone:
    name: 品牌调性贡献
    category: brand
    description: 视觉上是否兼具「时尚感+轻功能性户外+日常穿着」元素
    anchors:
      1:
        range: [1, 2]
        label: 视觉偏离调性
        description: 纯时尚设计（完全无功能元素）或纯专业户外（功能极夸张）或纯婴童风，视觉上看不出"户外+日常"的结合
      2:
        range: [3, 4]
        label: 视觉方向接近但弱
        description: 有功能元素但表达弱（只有基础版型无户外功能），或有功能但看起来不日常
      3:
        range: [5, 6]
        label: 视觉符合基础调性
        description: 能看出户外功能元素和日常穿着版型的基本结合
      4:
        range: [7, 8]
        label: 视觉强表达调性
        description: 户外功能设计突出同时日常感也强，视觉上是"户外+日常"的典型款式
      5:
        range: [9, 10]
        label: 视觉调性标杆款
        description: 完美呈现"时尚+轻功能户外+日常"三要素，视觉上有强烈的品牌代表性

  F10_uniqueness:
    name: 设计独特性
    category: brand
    description: 从视觉看设计语言的独特程度（相对常规基础款的差异度）
    anchors:
      1:
        range: [1, 2]
        label: 视觉完全基础款
        description: 市场泛滥的基础款视觉，各大品牌都在做的常规版型+常规配色，无任何差异化视觉点
      2:
        range: [3, 4]
        label: 视觉常见设计
        description: 当季常见风格/工艺组合，视觉上差异化不大
      3:
        range: [5, 6]
        label: 视觉有一定特色
        description: 有细节设计差异（如特殊拼接/小创新口袋），但整体框架仍在常见范围内
      4:
        range: [7, 8]
        label: 视觉明显独特
        description: 有罕见工艺/结构/细节组合（如特殊拼接/创新口袋系统/独特廓形处理），视觉上一眼能看出和常规款不同
      5:
        range: [9, 10]
        label: 视觉极罕见设计
        description: 独特廓形/材料/结构，视觉上市场罕见，有明确辨识度

feature_validation:
  divergence_threshold: 2.0
  confidence_threshold: 0.6
