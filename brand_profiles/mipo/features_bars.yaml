features:
  F01_silhouette:
    name: 廓形度
    category: physical
    description: 宽松/修身/廓形的程度
    anchors:
      1:
        range:
        - 1
        - 2
        label: 超紧贴身
        description: 运动压缩衣感，完全贴合身体轮廓。对MIPO 6-18岁全客群：运动可但日常上学穿不舒服，**销冠潜力低**。
      2:
        range:
        - 3
        - 4
        label: 修身
        description: 修身版型，略有余量，活动不紧绷但不宽松。对MIPO：基础版型，**销量中性**。
      3:
        range:
        - 5
        - 6
        label: 常规
        description: 标准H型版型，无明显宽松或紧身特征。对MIPO：安全不出错，**常规款销量**。
      4:
        range:
        - 7
        - 8
        label: 宽松oversize
        description: 明显宽松，比正常大1-2个码，有垂坠感但廓形清晰。对MIPO：**视觉冲击力强，能成主推**（MIPO爆款多为此档）。
      5:
        range:
        - 9
        - 10
        label: 超宽廓形
        description: 灯笼感/斗篷感/极度oversize，完全脱离身体轮廓。对MIPO：**廓形过重影响上学穿着，**直播间好看但退货率高，**销冠潜力反而低**。
  F02_clean_look:
    name: 利落感
    category: physical
    description: 视觉整洁度。短裤看腰头/松紧/裤脚剪裁（不看裤腿堆积！那是长裤的）；外套看领口/袖口/拉链；连衣裙看裙边/接缝/侧开叉。堆积/褶皱/零碎细节多=低分
    anchors:
      1:
        range:
        - 1
        - 2
        label: 视觉混乱
        description: 腰头松紧歪斜/裤脚剪裁毛边/领口变形/零碎装饰过多，整体拥挤无序。对MIPO：**父母会觉得难打理不上档次，**销量低。
      2:
        range:
        - 3
        - 4
        label: 不够利落
        description: 明显不规整（腰头歪/拉链不顺/接缝不齐）/过多功能细节显杂乱。对MIPO：**直播间看还好但拿到手显廉价，**退货率高。
      3:
        range:
        - 5
        - 6
        label: 常规
        description: 普通版型，无明显利落或不利落特征。对MIPO：**常规款销量**。
      4:
        range:
        - 7
        - 8
        label: 比较利落
        description: 腰头/领口/袖口规整，拉链/剪裁平顺，少量装饰不拥挤。对MIPO：**专业感强，父母愿意高价买**，**高销**。
      5:
        range:
        - 9
        - 10
        label: 极利落
        description: 极简结构，腰头/领口/袖口/裤脚全部工整，专业剪裁感。对MIPO：**高端旗舰版型，能成标杆款**，**销冠潜力高**。
  F03_color_safety:
    name: 色彩安全度
    category: physical
    description: 基础中性色（受众广、搜索端稳）= 高分；高饱和/撞色/荧光（视觉强但受众窄、退货率高）= 低分。⚠️ 颜色混淆澄清（关键！）：①「同一件衣服上的撞色/拼接」=
      F03 要评估的对象（如衣服本身有藏青+黄的拼接设计）；②「同款不同 SKU 的多个颜色」= 不是撞色！一款衣服有深灰/黄/藏青三个 SKU，这是分色铺货，F03
      只评主推色/主图色的安全度，绝不因其他 SKU 颜色拉低整款分。多色覆盖是优势（覆盖不同偏好客群），不是扣分。VLM 看到多张不同颜色的图时，先判断是「同一件衣服的撞色设计」还是「同款不同色
      SKU」，判断依据：如果不同颜色的图是不同件衣服（非拼接在同一件上）→ SKU 分色，以主推色为准。
    anchors:
      1:
        range:
        - 1
        - 2
        label: 极高风险色彩
        description: 荧光色/大面积撞色/渐变炫彩，视觉极度吸引眼球但受众极窄。对MIPO：**直播间第一屏抓人但受众窄**，退货率高，**销冠潜力极不稳定**。
      2:
        range:
        - 3
        - 4
        label: 偏高风险色彩
        description: 高饱和明亮色或多色拼接（色相差>120°）。对MIPO：**直播间吸睛但转化打折扣**，数据上 P 款（卖不动）更常见此档。
      3:
        range:
        - 5
        - 6
        label: 中性色彩
        description: 中等饱和度单色或简单双色拼接（色相差<60°）。对MIPO：**直播间有记忆点**，能成主推色，综合中性。
      4:
        range:
        - 7
        - 8
        label: 低风险彩色
        description: 莫兰迪色/大地色/低饱和粉蓝等柔和彩色系。对MIPO：**常规款**，受众不窄，搜索端和直播端都不吃亏。
      5:
        range:
        - 9
        - 10
        label: 安全基础色
        description: 黑/灰/藏青/卡其/军绿等低饱和基础中性色。对MIPO：**受众最广**，搜索端稳，虽然直播间吸睛度不如彩色但转化扎实，数据上 S 款（好卖）更常见此档。
  F04_function_visibility:
    name: 功能可见性
    category: physical
    description: 户外功能（防水/防风/防晒/反光/口袋）的视觉显性程度
    anchors:
      1:
        range:
        - 1
        - 2
        label: 无功能元素
        description: 完全无任何户外功能视觉元素，与普通休闲装无异。对MIPO：**偏离功能性户外定位，****高风险**。
      2:
        range:
        - 3
        - 4
        label: 隐约功能感
        description: 只有少量细节暗示功能（如接缝压胶/暗门襟等，不仔细看不易发现）。对MIPO：**功能卖点打不出来，**直播间没故事可讲。
      3:
        range:
        - 5
        - 6
        label: 常规功能可见
        description: 常规户外功能元素清晰可见（口袋/帽檐调节/松紧收边等）。对MIPO：**满足基本功能预期，**常规款销量。
      4:
        range:
        - 7
        - 8
        label: 明显功能设计
        description: 功能设计突出（防水压胶条/反光条/多口袋系统/魔术贴调节等多处可见）。对MIPO：**直播间能展示功能演示，**父母一看就觉得专业，**高销**。
      5:
        range:
        - 9
        - 10
        label: 硬核功能外显
        description: 全身功能细节外显（全身防水条/大量功能附件/战术扣件/硬核装备感）。对MIPO：**硬核户外感，**但日常上学略显夸张，**销冠潜力中等**。
  F05_photogenic:
    name: 上镜感
    category: perceptual
    description: 镜头表现力，直播/短视频画面里是否吸睛、有记忆点。⚠️ 如果多张图是同款不同 SKU 颜色，F05 只评估主推色的上镜感，不因某个彩色
      SKU 的上镜感好/差就拉高/拉低整款。
    anchors:
      1:
        range:
        - 1
        - 2
        label: 画面平淡
        description: 无视觉记忆点，镜头里很普通，容易被划走。对MIPO：**直播短视频死穴，**引流成本高，**销冠潜力极低**。
      2:
        range:
        - 3
        - 4
        label: 略有特色
        description: 有一定设计但记忆点弱，展示几秒后容易被遗忘。对MIPO：**常规款**。
      3:
        range:
        - 5
        - 6
        label: 常规表现
        description: 中规中矩，没有特别吸睛也不丑。对MIPO：**常规款**。
      4:
        range:
        - 7
        - 8
        label: 有视觉记忆点
        description: 有明显视觉标识（亮眼配色/独特廓形/吸睛细节），镜头下能记住。对MIPO：**能当封面款主推，**直播引流能力强，**高销**。
      5:
        range:
        - 9
        - 10
        label: 极强镜头冲击
        description: 一眼记住，画面冲击力极强，适合做封面和主推展示。对MIPO：**抖音爆款封面候选，**直播间停留率高，**销冠款**。
  F06_wearability:
    name: 实穿度
    category: perceptual
    description: 日常穿着场景覆盖度（上学/户外/日常多场景适配）
    anchors:
      1:
        range:
        - 1
        - 2
        label: 场景极窄
        description: 仅特定户外活动能穿（如极硬核登山服），日常上学不便穿着。对MIPO：**客群限制死，****高风险**。
      2:
        range:
        - 3
        - 4
        label: 场景受限
        description: 户外可穿但日常勉强（如过于夸张的廓形/功能造型影响上学穿着）。对MIPO：**父母买了孩子不穿，**退货率高。
      3:
        range:
        - 5
        - 6
        label: 常规场景覆盖
        description: 能覆盖日常上学或基础户外场景之一，但不是全部。对MIPO：**安全但不爆发，**常规款。
      4:
        range:
        - 7
        - 8
        label: 多场景适配
        description: 上学+户外+日常出行均可穿着，场景覆盖广。对MIPO：**核心爆品特征**，一件多穿能卖高价，**高销**。
      5:
        range:
        - 9
        - 10
        label: 全场景百搭
        description: 几乎任何场景都能穿，运动/上学/出游/社交均无违和感。对MIPO：**销冠必备条件，****爆款潜质极高**。
  F07_pairing:
    name: 搭配度
    category: perceptual
    description: 与现有衣橱搭配难度，独立性强=高分，挑搭配=低分
    anchors:
      1:
        range:
        - 1
        - 2
        label: 极挑搭配
        description: 必须特定下装/内搭组合才能穿好，和普通单品搭不起来。对MIPO：**父母担心孩子不会搭，**购买决策门槛高。
      2:
        range:
        - 3
        - 4
        label: 搭配受限
        description: 有一定搭配门槛，需要特定风格或颜色才能搭好。对MIPO：**常规款**。
      3:
        range:
        - 5
        - 6
        label: 常规搭配度
        description: 能与多数常见单品搭配，但需要稍费心思。对MIPO：**常规款**。
      4:
        range:
        - 7
        - 8
        label: 易搭配
        description: 与现有衣柜中大部分下装/内搭都能自然搭配。对MIPO：**妈妈愿意一次买多件，**连带率高。
      5:
        range:
        - 9
        - 10
        label: 百搭
        description: 几乎不挑搭配，任何风格/颜色的单品都能搭得和谐。对MIPO：**高连带率款，**能成主推款。
  F08_fabric_perception:
    name: 面料感知
    category: perceptual
    description: 从图片感知的「功能质感+穿着体验预期」
    anchors:
      1:
        range:
        - 1
        - 2
        label: 廉价无质感
        description: 视觉无功能质感，显廉价普通，容易担心起球/透/易皱。对MIPO：**直播间妈妈一眼pass，****高风险**。
      2:
        range:
        - 3
        - 4
        label: 普通面料感
        description: 常规棉涤/化纤感，无明显功能或高级质感特征。对MIPO：**价格要低才好卖，**否则父母会嫌弃。
      3:
        range:
        - 5
        - 6
        label: 常规质感适中
        description: 标准面料质感，能看出基础做工但功能感不突出。对MIPO：**常规款**。
      4:
        range:
        - 7
        - 8
        label: 明显功能质感
        description: 能看出科技面料特征（防晒涂层光泽/防水面料肌理/速干织纹等），预期穿着舒适。对MIPO：**功能感知卖点强，**能卖高价，**高销**。
      5:
        range:
        - 9
        - 10
        label: 高级功能质感
        description: 视觉传递出高级面料/高端工艺（天鹅绒/顶级防水布/精织肌理），预期穿着体验极好。对MIPO：**高端旗舰款，**能做标杆定价，**销冠潜力高**。
  F09_brand_tone:
    name: 品牌调性贡献
    category: brand
    description: 是否符合 MIPO「时尚感+轻功能性户外+日常穿着」定位。⚠️ 如果多张图是同款不同 SKU 颜色，F09 只看主推色的调性表现，不因其他
      SKU 颜色偏离调性就扣分（那是 SKU 选择问题，不是款式设计问题）。
    anchors:
      1:
        range:
        - 1
        - 2
        label: 偏离定位
        description: 完全不符合品牌户外+日常定位（如纯时尚/纯商务/纯婴童风）。对MIPO：**品牌资产浪费，****高风险**。
      2:
        range:
        - 3
        - 4
        label: 方向接近但弱
        description: 方向沾边但表达弱（如只有基础版型无户外功能，或只有功能但不日常）。对MIPO：**品牌调性模糊，**难成主推。
      3:
        range:
        - 5
        - 6
        label: 符合基础调性
        description: 符合品牌基本定位，户外功能与日常穿着基本兼顾。对MIPO：**常规款**。
      4:
        range:
        - 7
        - 8
        label: 强表达调性
        description: 户外功能设计突出同时日常场景也能穿，是品牌方向的代表性款式。对MIPO：**品牌标杆款，**直播间能打品牌故事，**销量中性**（大众接受度取决于实穿性）。
      5:
        range:
        - 9
        - 10
        label: 调性标杆款
        description: 完美诠释品牌精神，能作为品牌调性代言款的标杆设计。对MIPO：**品牌旗舰款，**新品宣发主力，但**销量中性偏低**（太专注调性可能牺牲大众接受度）。——
          这类通常是P款（品牌展示款）。
  F10_uniqueness:
    name: 设计独特性
    category: brand
    description: 市场同类款稀缺度，罕见设计语言/工艺/结构
    anchors:
      1:
        range:
        - 1
        - 2
        label: 完全跟款
        description: 市场泛滥的基础款，各大品牌都在做，无任何差异化点。对MIPO：**红海内卷，**价格战，**销冠潜力低**。
      2:
        range:
        - 3
        - 4
        label: 常见设计语言
        description: 当季常见风格/工艺组合，差异化不大。对MIPO：**常规款**。
      3:
        range:
        - 5
        - 6
        label: 有一定设计特色
        description: 有细节设计差异化，但整体框架仍在常见范围内。对MIPO：**中等潜力**。
      4:
        range:
        - 7
        - 8
        label: 明显独特设计
        description: 罕见工艺/结构/细节组合（如特殊拼接/创新口袋系统/独特廓形处理）。对MIPO：**直播间能打差异化，**但**销量中性偏低**（太独特可能受众窄）。——
          这类通常是P款（品牌调性展示款）。
      5:
        range:
        - 9
        - 10
        label: 极罕见设计语言
        description: 市场独此一家的设计表达，有明确辨识度和设计专利潜力。对MIPO：**独家设计强，但受众极窄，**几乎不可能成S款大销（设计感≠销量好）。——
          典型P款特征。
feature_validation:
  divergence_threshold: 2.0
  confidence_threshold: 0.6
