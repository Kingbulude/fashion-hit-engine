brand_id: mipo
brand_name: 蜜扑mipo
industry_segment: children_outdoor
target_age_range: [6, 18]
target_size_range: [110, 180]
decision_structure:
  type: multi_layer
  layers:
    - id: mom_decision_layer
      name: 妈妈决策者层（28-40岁华东新一线宝妈，主要影响6-12岁）
      persona_axis_key: identity_axes
      role: decider
      default_weight: 0.55
    - id: child_influence_layer
      name: 孩子/青少年影响层（6-18岁，13岁以上自主决策权增强）
      persona_axis_key: child_identity_axes
      role: veto
      default_weight: 0.45
  age_weight_rules:
    - age_range: [6, 8]
      mom_weight: 0.75
      child_weight: 0.25
      label: 妈妈主导（低年级）
    - age_range: [9, 11]
      mom_weight: 0.60
      child_weight: 0.40
      label: 共同决策（小学中高年级）
    - age_range: [12, 14]
      mom_weight: 0.35
      child_weight: 0.65
      label: 孩子主导（初中早期）
    - age_range: [15, 18]
      mom_weight: 0.30
      child_weight: 0.70
      label: 青少年自主（初高中，潮牌/街头审美）
default_target_age: 12
default_engine_weights:
  persona_voting: 0.35
  channel_scoring: 0.30
  price_value: 0.35
default_channel_split:
  natural: 0.45
  live_stream: 0.55
grading_thresholds:
  s: 7.5
  a_plus: 6.5
  a: 5.1
  p: 0.0

# ===== 品牌特定：销售标签 → 数值映射 =====
# MIPO 的销售数据来自多个分散渠道，没法直接拿到统一口径的售罄率/累计销量。
# 运营内部用有序标签「爆 / 旺 / 平 / 滞」（+ 兜底「其他」）来标记每款的本期销售表现。
# 该映射只对 MIPO 适配包生效；其他品牌没有 sales_label_mapping 字段时
# data_io 按通用 float/int 读取 Excel 里的销量列，完全不受影响。
#
# 数值大小即「销量好→差」的排序，供 3Loop 里 Spearman / rank_percentile 使用。
# 只要标签→数值的排序方向正确，绝对值大小对 Spearman 无关。
sales_label_mapping:
  "爆":  4    # 本期销量前 ~20%
  "旺":  3    # 本期销量 20-50%
  "平":  2    # 本期销量 50-80%
  "滞":  1    # 本期销量后 ~20%
  # "其他": 0   # 不明确 / 下架 / 数据缺失等兜底标签（当前不喂回校准）

# ===== 品牌特定：按年份分组校准 =====
# 当 Excel 里有「年份」列且能提供跨年度历史数据（如 2025 + 2026 四个季度）时，
# 开启此开关会让 3Loop 的每次校准按年份独立拟合权重：
#   - 每年的 Loop1/Loop2/Loop3 权重互不污染
#   - 避免跨年度风格漂移（如 2025 亮色户外 → 2026 暗黑机能）拉偏人设权重
# 当前设 False（默认）—— 因为 40-60 款混在一起跑 Lasso 比按年拆成 20-30 款
# 更容易稳定收敛。跑过一次完整 3Loop 确认人设权重稳定后再改 True。
calibration_group_by_year: false
# v1.4.51: MIPO 有正式内审分级流程（S/A+/A/P）→ grade_norm 参与 3Loop
has_internal_review: true

# v1.4.94+: 品牌品类专业知识（注入 Phase2 专家 prompt，让"品类总监"真正懂行）
# v1.4.95: 大幅扩充——加入国标号、年龄解刨、竞品格局、渠道打法、面料工艺
brand_domain_knowledge: |
  ═══════════════════════════════════════════════════════
  【品类定位】MIPO 蜜扑：6-14 岁儿童户外功能服饰
  核心差异化：专业户外面料/工艺 × 日常穿搭审美（区别于探路者 kids 的硬核户外、巴拉巴拉的时尚弱功能）
  ═══════════════════════════════════════════════════════

  ▎一、童装户外安全合规（红线，不能碰）
  · 面料安全等级：GB 18401-2010《国家纺织产品基本安全技术规范》
    - 直接接触皮肤的必须 A 类（婴幼儿级，甲醛≤20mg/kg、pH 4.0-7.5）
    - 非直接接触皮肤至少 B 类；C 类禁止销售给 12 岁以下儿童
  · 绳带安全：GB 20227-2006《儿童服装安全规范》
    - 头部/颈部绳带长度不得超 14cm，不得有自由端（防止缠绕窒息）
    - 腰部绳带不得超出服装外缘 6cm
    - 帽子帽绳必须可调节且有锁扣
  · 荧光剂：A 类标准禁止添加荧光增白剂；实测是宝妈退货 Top3 原因
  · 阻燃性能：露营/户外场景童装需符合 GB 20286 阻燃 1 级

  ▎二、童装版型解刨学（成人版缩小 = 穿不住）
  · 肩线：6-10 岁儿童肩线前倾 15-20°（圆肩体态），成人肩线是 0° —— 照搬成人版型会溜肩、卡腋下
  · 袖笼：儿童袖笼要比同码成人宽 3cm（需要更大活动量，跑跳不卡）
  · 衣长：儿童躯干短，衣长按身高的 40% 算（成人是 44%）—— 太长压个子
  · 裤腰：6-12 岁必须带松紧或抽绳（儿童还没发育出腰型，直上直下）；13+ 可以用半松紧
  · 裤子裆部：儿童运动量大，裆部必须加 U 型裆布（三角/菱形）—— 否则劈叉、爬树会崩
  · 裤脚/袖口：必须加罗纹或包边（耐磨耐脏，脏了可以卷起来）；平边设计洗 3 次就变形
  · 活动量预留：运动类童装胸围要放 8-10cm 松量（成人运动装是 4-6cm）

  ▎三、童装户外功能面料速查
  · 防晒衣：必须 UPF 50+（GB/T 18830 标准），用涤氨纶包覆或陶瓷纤维；纯棉/真丝没有防晒效果
  · 速干衣：必须用聚酯纤维 ≥85% 或丙纶（GB/T 21655 速干标准）；纯棉会闷汗着凉
  · 防水外套：涂层用 PU 或 PTFE（GORE-TEX 是高端背书），透湿性 ≥5000g/m²·24h 才不闷
  · 抓绒/保暖：3M Thinsulate（轻薄保暖）或 Primaloft（拒水保暖）比摇粒绒贵 2-3 倍但效果好 5 倍
  · 童装特殊要求：面料必须抗起球（GB/T 4802 法测 3000 转起球等级 ≥3级）、抗缩水（≤3%）、耐摩擦色牢度 ≥4级

  ▎四、目标年龄分层（6-14 岁不是一个人群）
  · 6-8 岁（低年级）：妈妈 75% 主导。关注安全 + 鲜艳颜色（安全感+辨识度，防走失）。接受度最高的价格：¥150-250
  · 9-11 岁（小学中高年级）：60/40 共同决策。开始有自己的喜好但仍听妈妈的。颜色偏好向马卡龙/低饱和过渡。价格接受 ¥200-300
  · 12-14 岁（初中早期）：孩子 65% 主导。追求"酷"——拒绝卡通、拒绝高饱和、拒绝妈妈审美。偏好暗黑机能/城市户外风格。价格接受 ¥250-400，愿意为 GORE-TEX/联名款多付钱
  · ⚠️ 关键断层：11 岁 vs 12 岁是审美转折点。一款能卖爆 9-11 岁的设计到 12+ 会滞销（太幼稚）。

  ▎五、场景适配矩阵（决定面料/版型/配色选型）
  · 校园日常（70% 穿着时间）：
    - 面料要抗皱、易洗快干（妈妈没时间熨烫）、颜色要耐脏（白/粉/浅蓝洗 1 次就废）
    - 版型不能太夸张（校规限制）、口袋要多（放水杯/纸巾/红领巾）
  · 周末户外（20% 穿着时间，品牌溢价场景）：
    - 面料要真功能（UPF/防水/透气）、配色要出片（小红书/朋友圈晒）
    - 版型要方便活动（肩线正确、裆部有 U 布）
  · 运动穿搭（10%，增长最快）：
    - 面料要速干排汗、版型要运动剪裁、配色要简洁
    - 抖音/小红书"儿童ootd"关键词月搜索量 2000 万+

  ▎六、竞品格局与差异化定位
  · 一线：探路者 kids（硬核户外，价 ¥300-600，渠道线下店+天猫）、骆驼 kids（性价比户外，¥180-350，抖音强）
  · 时尚跨界：巴拉巴拉（户外线，¥100-250，SKU 多但功能弱）、安踏儿童（运动户外，¥150-300）
  · MIPO 差异化：功能对标探路者 kids（用同等级面料），审美对标潮牌童装（非卡通），价格卡在中间 ¥150-350
  · 空白机会：8-14 岁"校园+户外"跨界款（目前没人做好——探路者太硬核穿不去上学，巴拉巴拉太时尚没功能）

  ▎七、渠道与定价逻辑
  · 抖音直播（55% 销量）：宝妈在直播间冲动下单，主播话术要打"安全""功能""孩子喜欢"三点；¥299-350 是直播间转化最高区间
  · 天猫/京东（25% 销量）：搜索"儿童防晒衣""儿童速干衣"的是精准需求用户，详情页必须放国标号和实测数据
  · 私域/老客（15% 销量）：复购用户是因为信任品质——可以推送同面料不同款
  · 线下快闪/分销（5%）：体验场景，测试新款
  · 定价锚点：同面料竞品比价的 -10% 到 +15% 区间；功能溢价（如加 GORE-TEX）可以加 ¥100-150

  ▎八、反模式红线（碰到这些就是滞销款）
  ❌ 成人户外版型缩小卖给孩子 → 肩线前倾不够、重心上移、穿不住 1 次就丢
  ❌ 视觉党做功能款（如防晒衣只用 100% 纯棉、速干衣用粘胶纤维）→ 宝妈收到货发现没效果直接退款
  ❌ 用 100% 聚酯纤维做贴身层（不添加氨纶/莫代尔）→ 闷汗、起静电、孩子说痒
  ❌ 卡通 IP 款给 12+ 岁 → 孩子觉得幼稚拒绝穿
  ❌ 高饱和撞色给 9+ 岁 → "我又不是幼儿园小朋友"
  ❌ 绳带长度超 GB 20227 标准 → 过不了天猫品控、上不了抖音
  ❌ 忽略 12+ 孩子自主审美 → 妈妈买了孩子不穿 = 库存积压
  ❌ 水洗标错误标注成分 → 专业宝妈会拍照投诉到消协
