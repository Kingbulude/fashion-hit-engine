brand_id: mipo
brand_name: MIPO蜜扑
industry_segment: children_outdoor
target_age_range: [6, 18]
target_size_range: [110, 180]
decision_structure:
  type: multi_layer
  layers:
    - id: mom_decision_layer
      name: 妈妈决策者层（28-40岁华东新一线宝妈，主要影响6-12岁）
      persona_axis_key: identity_axes
      role: decider
      default_weight: 0.55
    - id: child_influence_layer
      name: 孩子/青少年影响层（6-18岁，13岁以上自主决策权增强）
      persona_axis_key: child_identity_axes
      role: veto
      default_weight: 0.45
  age_weight_rules:
    - age_range: [6, 8]
      mom_weight: 0.75
      child_weight: 0.25
      label: 妈妈主导（低年级）
    - age_range: [9, 11]
      mom_weight: 0.60
      child_weight: 0.40
      label: 共同决策（小学中高年级）
    - age_range: [12, 14]
      mom_weight: 0.35
      child_weight: 0.65
      label: 孩子主导（初中早期）
    - age_range: [15, 18]
      mom_weight: 0.30
      child_weight: 0.70
      label: 青少年自主（初高中，潮牌/街头审美）
default_target_age: 12
default_engine_weights:
  persona_voting: 0.35
  channel_scoring: 0.30
  price_value: 0.35
default_channel_split:
  natural: 0.45
  live_stream: 0.55
grading_thresholds:
  s: 7.5
  a_plus: 6.5
  a: 5.1
  p: 0.0

# ===== 品牌特定：销售标签 → 数值映射 =====
# MIPO 的销售数据来自多个分散渠道，没法直接拿到统一口径的售罄率/累计销量。
# 运营内部用有序标签「爆 / 旺 / 平 / 滞」（+ 兜底「其他」）来标记每款的本期销售表现。
# 该映射只对 MIPO 适配包生效；其他品牌没有 sales_label_mapping 字段时
# data_io 按通用 float/int 读取 Excel 里的销量列，完全不受影响。
#
# 数值大小即「销量好→差」的排序，供 3Loop 里 Spearman / rank_percentile 使用。
# 只要标签→数值的排序方向正确，绝对值大小对 Spearman 无关。
sales_label_mapping:
  "爆":  4    # 本期销量前 ~20%
  "旺":  3    # 本期销量 20-50%
  "平":  2    # 本期销量 50-80%
  "滞":  1    # 本期销量后 ~20%
  # "其他": 0   # 不明确 / 下架 / 数据缺失等兜底标签（当前不喂回校准）

# ===== 品牌特定：按年份分组校准 =====
# 当 Excel 里有「年份」列且能提供跨年度历史数据（如 2025 + 2026 四个季度）时，
# 开启此开关会让 3Loop 的每次校准按年份独立拟合权重：
#   - 每年的 Loop1/Loop2/Loop3 权重互不污染
#   - 避免跨年度风格漂移（如 2025 亮色户外 → 2026 暗黑机能）拉偏人设权重
# 当前设 False（默认）—— 因为 40-60 款混在一起跑 Lasso 比按年拆成 20-30 款
# 更容易稳定收敛。跑过一次完整 3Loop 确认人设权重稳定后再改 True。
calibration_group_by_year: false
